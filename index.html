<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cards Animados com Texto Fora</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- Wrapper 1: Flutuação -->
        <div class="card-wrapper">
            <div class="card card-flutuar bg-card-1"></div>
            <div class="card-info">
                <h2>Flutuação</h2>
                <p>Este card fica flutuando suavemente para cima e para baixo.</p>
            </div>
        </div>

        <!-- Wrapper 2: Zoom -->
        <div class="card-wrapper">
            <div class="card card-zoom bg-card-2"></div>
            <div class="card-info">
                <h2>Zoom</h2>
                <p>Este card aumenta e diminui de tamanho continuamente.</p>
            </div>
        </div>

        <!-- Wrapper 3: Rotação 3D -->
        <div class="card-wrapper">
            <div class="card card-rotacao bg-card-3"></div>
            <div class="card-info">
                <h2>Rotação 3D</h2>
                <p>Este card gira continuamente no eixo Y em 3D.</p>
            </div>
        </div>
    </div>

</body>
</html>
